<html>

<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1/locales/de.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.4.0/build/ical.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/icalendar@6.1.20/index.global.min.js"></script>
  <script src="caldav.js"></script>
  <script src="dblclick.js"></script>
  <script src="loading.js"></script>
  <script src="multicol.js"></script>
  <script src="nextcloud.js"></script>
  <script src="switcher.js"></script>
  <script src="yearview.js"></script>
  <style>
    #calendar {
      font-family: sans-serif;
    }

    .fc-bg-event {
      color: transparent
    }
  </style>
</head>

<body>
  <div id="calendar"></div>
  <script>
    const auth = new NextcloudAuth(
      "https://cloud.lutherkirche-hasslau.de",
      "QUmcLLprRljLCop5NfjVvZ9RKbSID5gQm3QtbkYVIY17aVgrq3tTri7IoEwAzpUo",
      "AB9N9aSQ0DYyvfM9cFqmjX0rlJyJpCOLqqINbgDTpmCoaWZzvJIsWS1Gs7UMPqmc");
    const cal = new FullCalendar.Calendar(
      document.getElementById("calendar"),
      {
        // activate plugins
        plugins: [
          CalDavPlugin,
          EventDblClickPlugin,
          LoadingPlugin,
          MultiColumnPlugin,
          SwitcherPlugin,
          YearViewPlugin
        ],

        // configure CalDav calendars
        eventSources: [
          { // Ferien
            url: "https://cloud.lutherkirche-hasslau.de/proxy/https://ics.tools/Feiertage/sachsen.ics",
            format: "ics",
            color: "blue",
            display: "auto",
          },
          { // Feiertage
            url: "https://cloud.lutherkirche-hasslau.de/proxy/https://ics.tools/Ferien/sachsen.ics",
            format: "ics",
            color: "red",
            display: "background",
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/dwLmdLxHPsPzERgm",
            format: "caldav",
            name: "Veranstaltung",
            display: "block",
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/mD9DADWJ5z29yw96",
            format: "caldav",
            name: "Predigt",
            display: "block",
            titleEditable: true,
            auth: auth,
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/5JHYT2HxT7t5TFtH",
            format: "caldav",
            name: "Musik",
            display: "block",
            titleEditable: true,
            auth: auth,
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/848yxMjFjoExqFHq",
            format: "caldav",
            name: "Begrüßung",
            display: "block",
            titleEditable: true,
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/MZJmKWzT8y7NRGeC",
            format: "caldav",
            name: "Lesung",
            display: "block",
            titleEditable: true,
            auth: auth,
          },
          {
            url: "https://cloud.lutherkirche-hasslau.de/remote.php/dav/public-calendars/4HYt8RamSNZG3yjp",
            format: "caldav",
            name: "KiGo",
            display: "block",
            titleEditable: true,
            auth: auth,
          },
          {
            url: "https://kirchenjahr-evangelisch.de/app/themes/main/assets/files/ical/kirchenjahr-evangelisch-all.ics",
            format: "ics",
            color: "lightgray",
            name: "Kirchenjahr",
          },
        ],
        eventSourceSuccess: function (content, response) {
          return content.filter(event => !event.extendedProps?.description?.includes("#regel") && !event.extendedProps?.description?.includes("#gruppe"))
        },

        // add multiCol and yearView to toolbar
        headerToolbar: {
          center: "title",
          left: "prev,next today",
          right:
            "addCalDav switcher multiCol,yearView listWeek,timeGridWeek,dayGridWeek,dayGridMonth,multiMonthYear",
        },

        // default settings
        displayEventEnd: false,
        eventTimeFormat: {
          hour: "2-digit",
          hour12: false,
          minute: "2-digit",
          meridiem: false,
        },
        weekNumbers: true,

        // custom test settings
        customButtons: {
          addCalDav: {
            text: "+CalDav",
            click: function () {
              const url = prompt("Please enter a CalDav URL.");
              if (url) {
                cal.addEventSource({ url, format: "caldav" });
              }
            },
          },
          selectiveprint: {
            text: "Print",
            click: function () {
              console.log("print");
            },
          },
        },
        eventContent: function (arg) {
          return {
            html:
              '<div style="display:inline-block;overflow:hidden;width:100%;"><b>' +
              arg.timeText +
              "</b> " +
              arg.event.title +
              (arg.event.extendedProps?.location
                ? ' <i style="display:inline-block;float:right">' +
                arg.event.extendedProps?.location +
                "</i>"
                : "") +
              "</div>",
          };
        },
        eventDblClick: function (arg) {
          const isEditable = (event, property) => {
            return (
              event.display !== "background" &&
              (event.extendedProps[`${property.toLowerCase()}Editable`] === true ||
                event.source?.internalEventSource.extendedProps[
                `${property.toLowerCase()}Editable`
                ] === true)
            );
          }
          if (!isEditable(arg.event, "title")) {
            return;
          }
          const input = prompt("Wer übernimmt diese Aufgabe?", arg.event.title);
          if (input !== null && arg.event.title !== input) {
            arg.event.setProp("title", input);
          }
        },
      }
    );
    cal.render();
  </script>
</body>

</html>
